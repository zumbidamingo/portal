server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-Security-Policy: limita o que um XSS consegue fazer (carregar script alheio, exfiltrar dados).
    # Sem 'unsafe-inline' em script-src: os scripts do index.html são ficheiros externos. 'unsafe-inline'
    # só em style-src (PrimeNG e Angular aplicam estilos por atributo). Origens externas: login Google e
    # Facebook, fontes Google, mapa (tiles Carto), e a API em *.suaoperacao.com quando não é same-origin.
    # `add_header` num location anula os do server: repetir em todo location que defina o seu (ver abaixo).
    set $csp "default-src 'self'; script-src 'self' https://accounts.google.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.suaoperacao.com https://*.cartocdn.com https://accounts.google.com https://graph.facebook.com https://www.facebook.com https://connect.facebook.net; frame-src https://accounts.google.com https://www.facebook.com https://web.facebook.com; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    add_header Content-Security-Policy $csp always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # maplibre-gl 6 carrega o worker como módulo ES por URL (maplibre-gl-worker.mjs, copiado pelo build).
    # O nginx não conhece .mjs e serviria application/octet-stream, que um module worker recusa.
    # O `include` e o `types` ficam no mesmo nível para se somarem em vez de o segundo apagar o primeiro.
    include /etc/nginx/mime.types;
    types { text/javascript mjs; }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Proxy /api/* and /ws/* to the backend.
    # resolver + set forces Docker DNS re-resolution on every request — a static
    # `proxy_pass http://suaoperacao-api:8080` caches the IP at nginx startup and goes
    # stale (502) the next time the suaoperacao-api container is recreated.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream suaoperacao-api:8080;

    # ^~ stops nginx from falling through to the extension regex location below
    # for paths like /api/v1/files/photos/xxx.png — without it, a regex location
    # always wins over a plain prefix location regardless of declaration order.
    location ^~ /api/ {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        # Passa o X-Real-IP que o edge já escreveu ($remote_addr do browser) à frente — reescrever
        # aqui com $remote_addr colapsaria todo o tráfego same-origin no IP do próprio proxy e o
        # backend perderia o IP real do cliente (issue #225).
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Angular routing – fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always revalidate — it points at hashed JS/CSS chunks,
    # so a stale cached index keeps loading old bundles after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $csp always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
